<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConnectHub - Profile</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-logo">ConnectHub</div>

        <div class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="profile.html">Profile</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- Profile -->
    <main class="profile-container">

        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h1 id="profileName">
                Loading...
            </h1>

            <p id="profileEmail">
                Loading...
            </p>

            <div class="profile-stats">

                <div>
                    <strong id="postCount">0</strong>
                    <span>Posts</span>
                </div>

                <div>
                    <strong id="likeCount">0</strong>
                    <span>Likes Received</span>
                </div>

            </div>

        </section>

    </main>


    <script src="js/profile.js"></script>

</body>

</html>
