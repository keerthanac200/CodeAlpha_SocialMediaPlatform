<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConnectHub - Home</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-logo">ConnectHub</div>

        <div class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="profile.html">Profile</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- Main Dashboard -->
    <main class="dashboard">

        <!-- Welcome Section -->
        <section class="welcome-card">

            <div>
                <h1>Welcome to ConnectHub 👋</h1>
                <p>Share your thoughts and connect with others.</p>
            </div>

        </section>


        <!-- Create Post -->
        <section class="create-post-card">

            <h2>Create a Post</h2>

            <textarea
                id="postContent"
                placeholder="What's on your mind?"
                maxlength="500"
            ></textarea>

            <div class="post-actions">

                <span id="characterCount">
                    0 / 500
                </span>

                <button id="createPostBtn">
                    Post
                </button>

            </div>

            <p id="postMessage"></p>

        </section>
        <!-- People to Follow -->
        <section class="users-section">
            <h2>People to Follow</h2>

            <div id="usersContainer">
                <!-- Users will be loaded here -->
            </div>
        </section>
        
        <!-- Feed -->
        <section class="feed-section">

            <div class="feed-header">
                <h2>Recent Posts</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔎 Search posts..."
                >
            </div>

            <div id="postsContainer">

                <p class="empty-message">
                    No posts yet. Be the first to post!
                </p>

            </div>

        </section>

    </main>


    <script src="js/dashboard.js"></script>

</body>
</html>
