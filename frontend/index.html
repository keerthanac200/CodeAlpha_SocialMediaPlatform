<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectHub - Social Media Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="brand-section">
            <h1>ConnectHub</h1>
            <p>Connect. Share. Discover.</p>
        </div>

        <div class="auth-card">

            <div class="tabs">
                <button id="loginTab" class="tab active">Login</button>
                <button id="registerTab" class="tab">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <h2>Welcome Back</h2>
                <p class="form-subtitle">Login to continue to ConnectHub</p>

                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn">
                    Login
                </button>

                <p id="loginMessage" class="message"></p>

            </form>

            <!-- Register Form -->
            <form id="registerForm" class="hidden">

                <h2>Create Account</h2>
                <p class="form-subtitle">Join the ConnectHub community</p>

                <div class="input-group">
                    <label for="registerName">Name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

                <p id="registerMessage" class="message"></p>

            </form>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
